name: Deploy Notification

# Announces a new SDK release in the team's shared deployment Slack channel.
#
# This repository is public, so it cannot reuse the organisation's shared release
# notification workflow the way the team's other projects do: reusable workflows held in
# a private repository are not resolvable from a public caller, and a public repository
# cannot use the self-hosted runners or the secret store that workflow depends on. The
# webhook URL is therefore supplied as a GitHub Actions secret instead. See MIG-18859.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to announce, e.g. 6.0.4'
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release version
        id: release
        env:
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        run: |
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::Could not determine which release version to announce."
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Slack webhook is configured
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::Secret SLACK_DEPLOY_WEBHOOK_URL is not set for this repository, so the release cannot be announced. See MIG-18859."
            exit 1
          fi

      - name: Build Slack payload
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          # Slack rejects any single text object over 3000 characters, so leave headroom.
          MAX_NOTES_CHARS: 2800
        run: |
          # Fetched by tag rather than read from the event payload so that release-triggered
          # and manually dispatched runs take the same path. A release with no notes, or a
          # version with no GitHub release at all, degrades to announcing without notes.
          BODY=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" --jq '.body // ""' 2>/dev/null || echo "")

          # GitHub markdown -> Slack mrkdwn: bold, headings, inline links, bullets.
          NOTES=$(printf '%s' "$BODY" | tr -d '\r' \
            | sed -E 's/\*\*([^*]+)\*\*/*\1*/g' \
            | sed -E 's/^#{1,6} +(.*)$/*\1*/' \
            | sed -E 's/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g' \
            | sed -E 's/^\* /• /')

          if [ "${#NOTES}" -gt "$MAX_NOTES_CHARS" ]; then
            NOTES="${NOTES:0:$MAX_NOTES_CHARS}"$'\n'"…(truncated, see the full release notes linked above)"
          fi

          HEADLINE=":arbor-love: We've just released a new version of $GITHUB_REPOSITORY *$VERSION*"
          FALLBACK="We've just released a new version of $GITHUB_REPOSITORY $VERSION"
          LINK="<https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION|Github release notes for $VERSION>"

          # Built with jq so that quotes, backslashes and newlines in the release notes
          # cannot break the payload.
          PAYLOAD=$(jq -cn \
            --arg fallback "$FALLBACK" \
            --arg headline "$HEADLINE" \
            --arg link "$LINK" \
            --arg notes "$NOTES" \
            '{
              text: $fallback,
              blocks: ([
                { type: "section", text: { type: "mrkdwn", text: $headline } },
                { type: "section", text: { type: "mrkdwn", text: $link } }
              ] + (if ($notes | length) > 0 then [
                { type: "divider" },
                { type: "section", text: { type: "mrkdwn", text: $notes } }
              ] else [] end))
            }')

          echo "json=$PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Send release notification to Slack
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.payload.outputs.json }}
